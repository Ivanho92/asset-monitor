name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    name: Backend (build, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Build and test
        working-directory: backend
        run: mvn -B clean verify

  frontend:
    name: Frontend (build, audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

      # Report-only: npm audit flags a lot of low-severity transitive-dependency
      # noise. Findings are visible in the log without blocking the build.
      - name: Dependency audit (report only)
        working-directory: frontend
        run: npm audit --audit-level=high || true

  fake-sources:
    name: Fake sources (test, audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: fake-sources/requirements-dev.txt

      - name: Install dependencies
        working-directory: fake-sources
        run: pip install -r requirements-dev.txt

      - name: Run tests
        working-directory: fake-sources
        run: pytest

      - name: Dependency audit (report only)
        working-directory: fake-sources
        run: |
          pip install pip-audit
          pip-audit || true

  security-scan:
    name: Security scan (Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      # Scans dependency manifests across all three components (pom.xml,
      # package-lock.json, requirements*.txt) in one pass, no per-ecosystem
      # tool needed. Report-only here (exit-code 0) -- findings are uploaded
      # to the repo's Security tab rather than failing the build.
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-results.sarif
          exit-code: 0

      - name: Upload results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
