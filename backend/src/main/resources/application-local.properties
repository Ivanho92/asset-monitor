# Used when running the backend natively (mvn spring-boot:run) while xmpp and db
# still run in Docker. The default application.properties uses Docker-internal
# hostnames (xmpp, db) that only resolve inside the Docker network -- this profile
# points at the same services via their published localhost ports instead.
#
# Usage:
#   docker compose up -d xmpp db fake-sources
#   mvn spring-boot:run -Dspring-boot.run.profiles=local

xmpp.server.host=localhost
spring.datasource.url=jdbc:postgresql://localhost:5432/assetmonitor
