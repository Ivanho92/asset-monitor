# This compose file is what runs INSIDE the VM.
# Unlike the root docker-compose.yml (used for host-side building), this one references
# already-loaded image tags directly and has no `build:` step and no image pulls --
# everything it needs was transferred in as tarballs and loaded with `docker load`.

services:
  backend:
    image: asset-monitor-backend:latest
    ports:
      - "8080:8080"

  frontend:
    image: asset-monitor-frontend:latest
    ports:
      - "4200:4200"
    depends_on:
      - backend
